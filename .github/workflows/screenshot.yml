name: Screenshot overlay

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/preview.png"

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (requis par Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dependances
        run: bun install

      - name: Build de l'overlay
        run: bun run build

      - name: Installer Chromium (Playwright)
        run: bunx playwright install --with-deps chromium

      - name: Capturer le rendu
        run: bun run screenshot

      - name: Commit la capture si elle a change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview.png
          if git diff --cached --quiet; then
            echo "Pas de changement visuel, rien a committer."
          else
            git commit -m "chore: update overlay preview screenshot [skip ci]"
            git push
          fi
