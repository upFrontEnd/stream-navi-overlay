<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay Twitch - Support MEMU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/scss/overlay.scss">
</head>
<body>

<div class="overlay">

  <!-- Ecran : supprimer .screen__map pour un fond uni -->
  <div class="screen">
    <div class="screen__content">
      <!-- Contenu libre ici -->
    </div>
  </div>

  <div class="frame"></div>

  <!-- Bandeau : logo de la compagnie en cours -->
  <div class="badge">
    <img class="badge__logo" data-logo src="logos/air-france.svg" alt="Air France">
  </div>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

</div>

<script type="module" src="/js/overlay.js"></script>
</body>
</html>
