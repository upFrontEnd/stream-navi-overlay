<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay Twitch - Support MEMU</title>
<link rel="stylesheet" href="/scss/overlay.scss">
<!--
  Overlay Twitch converti depuis Twitch_-_Support_pour_MEMU.psd
  Dimensions natives : 392 x 625 px

  Arborescence du projet (Vite) :
    index.html
    scss/overlay.scss
    js/overlay.js
    img/map.jpg
    logos/            <- les logos des compagnies (a ajouter)

  Dev   : bun run dev      (serveur Vite avec rechargement)
  Build : bun run build    (genere dist/, a utiliser dans OBS)

  OBS : Sources > + > Source navigateur > Fichier local > dist/index.html
        Largeur 392, Hauteur 625 (a multiplier par --scale si modifiee)

  Logo automatique via StreamFlight (MSFS) :
    1. Dans StreamFlight, regle le dossier "Output" sur le MEME dossier
       que dist/index.html.
    2. L'overlay lit callsign.txt dans ce dossier toutes les 2 s et en
       deduit la compagnie (3 premieres lettres, ex. AFR1234 -> AFR).
    3. Si StreamFlight utilise un autre nom de fichier chez toi, corrige
       STREAMFLIGHT_FICHIER dans js/overlay.js.

  Test manuel (desactive StreamFlight pour la session) : parametre ?cie=
  dans l'URL de la source navigateur,
  par exemple  file:///C:/overlay-memu/dist/index.html?cie=AFR
  La liste des compagnies se configure dans js/overlay.js
-->
</head>
<body>

<div class="overlay">

  <!-- Ecran : supprimer .screen__map pour un fond uni -->
  <div class="screen">
    <div class="screen__map"></div>
    <div class="screen__content">
      <!-- Contenu libre ici -->
    </div>
  </div>

  <div class="frame"></div>
  <div class="frame-inner"></div>

  <!-- Bandeau : logo de la compagnie en cours -->
  <div class="badge">
    <img class="badge__logo" data-logo src="" alt="" hidden>
  </div>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

</div>

<script type="module" src="/js/overlay.js"></script>
</body>
</html>
